<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>60 Full Template Previews | CareerCraft</title><link rel="stylesheet" href="/styles.css"><style>
.wrap{max-width:1250px;margin:auto;padding:55px 5%}.intro{text-align:center;margin-bottom:30px}.tabs{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:25px 0 35px}.tabs button{border:1px solid #e4ddec;background:#fff;padding:11px 17px;border-radius:9px;font-weight:700;color:#5d526f}.tabs button.active{background:#7544dc;color:white;border-color:#7544dc}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.card{padding:13px;border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}.preview{height:390px;background:#f7f5fa;padding:18px;display:flex;justify-content:center;overflow:hidden}.sheet{width:100%;max-width:255px;min-height:350px;background:white;box-shadow:0 5px 20px #25134418;padding:25px 20px;color:#24212a;border-top:7px solid var(--accent);position:relative;overflow:hidden}.sheet.side:before{content:"";position:absolute;left:0;top:0;bottom:0;width:28%;background:var(--accent);opacity:.13}.sheet.side>*{position:relative}.sheet h3{font:800 13px Manrope;margin:5px 0;color:#202033}.sheet .contact{font-size:7px;color:#777;margin:7px 0 16px}.sheet h4{font:800 8px Manrope;letter-spacing:1px;color:var(--accent);margin:17px 0 7px}.line{height:4px;background:#e9e6ed;margin:6px 0;border-radius:4px}.line.short{width:65%}.line.mid{width:82%}.sheet .stamp{height:34px;width:34px;border-radius:50%;background:var(--accent);opacity:.15;float:right}.card h3{font:800 15px Manrope;margin:14px 3px 5px}.card p{font-size:11px;color:#766e84;margin:0 3px 12px}.card a{display:inline-block;margin:0 3px 5px;color:#7544dc;font-size:12px;font-weight:800}.number{font-size:9px;letter-spacing:1px;color:#8a8098;margin:0 3px}.empty{grid-column:1/-1;text-align:center;color:#766e84;padding:40px}
@media(max-width:850px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.gallery{grid-template-columns:1fr}.preview{height:400px}.wrap{padding:38px 5%}}
</style></head><body><header class="site-header"><a class="brand" href="/">CareerCraft</a><nav class="main-nav"><a href="/">Home</a><a href="/builder.html">Builder</a><a href="/pricing.html">Pricing</a></nav></header><main class="wrap"><div class="intro"><span class="eyebrow">60 FULL DESIGN PREVIEWS</span><h1 style="font:800 40px Manrope">Choose your <em style="color:#7544dc">template.</em></h1><p style="color:#766e84">Browse all 20 designs in each category. Previews are clear and visible before payment.</p></div><div class="tabs"><button class="active" data-kind="cv">CV / Resume · 20</button><button data-kind="letter">Application Letters · 20</button><button data-kind="tenancy">Tenancy Agreements · 20</button></div><div id="gallery" class="gallery"></div></main><footer class="site-footer">CareerCraft Ghana</footer><script>
const names={"cv":["Classic Professional","Modern Sidebar","Elegant Executive","Minimal Clean","Creative Profile","Academic Focus","Corporate Bold","Graduate Starter","Professional Compact","Contemporary","Technical Specialist","Healthcare Professional","Finance Executive","Marketing Creative","Two Column Modern","Clean Monochrome","Navy Executive","Warm Editorial","Simple ATS","Premium Profile"],"letter":["Formal Business","Modern Corporate","Minimal Letter","Executive Correspondence","Classic Serif","Clean Contemporary","Bold Header","Elegant Editorial","Graduate Application","Creative Agency","Professional Navy","Warm Neutral","Academic Letter","Finance Formal","Healthcare Application","Compact Business","Modern Accent","Traditional Formal","Simple ATS Letter","Premium Correspondence"],"tenancy":["Classic Agreement","Modern Property","Formal Legal Layout","Clean Minimal","Executive Property","Residential Standard","Bold Sectioned","Elegant Contract","Compact Agreement","Contemporary Lease","Professional Rental","Neutral Property","Premium Tenancy","Simple Legal","Structured Lease","Modern Landlord","Tenant Friendly","Formal Serif","Clear Terms","Property Manager"]};const colors=["#263b68","#315d72","#80604b","#41414b","#7544dc","#17675e","#252b38","#8a593c","#44516a","#365d86","#245b70","#6a4d7c","#3f5960","#9a563d","#4d547d","#353535","#183f68","#7b5a49","#285b50","#63438d"];let kind="cv";
function preview(n,i){let accent=colors[i],side=i%4===1?"side":"";let sections=n==="cv"?["PROFILE","EXPERIENCE","EDUCATION","SKILLS"]:n==="letter"?["RECIPIENT","SUBJECT","LETTER BODY","SIGNATURE"]:["PARTIES","PROPERTY DETAILS","RENT & PERIOD","TERMS & CONDITIONS","SIGNATURES"];return '<div class="preview"><div class="sheet '+side+'" style="--accent:'+accent+'"><div class="stamp"></div><h3>'+ (n==="cv"?"YOUR NAME":n==="letter"?"APPLICATION LETTER":"TENANCY AGREEMENT")+'</h3><div class="contact">'+(n==="cv"?"PROFESSIONAL PROFILE":n==="letter"?"DATE · RECIPIENT · CONTACT":"LANDLORD · TENANT · PROPERTY")+'</div>'+sections.map((s,j)=>'<h4>'+s+'</h4><div class="line"></div><div class="line mid"></div>'+(j===0?'<div class="line short"></div>':'')).join("")+'</div></div>'}
function draw(){const g=document.getElementById("gallery");g.innerHTML=names[kind].map((name,i)=>{let id=kind+"-"+String(i+1).padStart(2,"0");return '<article class="card">'+preview(kind,i)+'<div class="number">DESIGN '+String(i+1).padStart(2,"0")+' OF 20</div><h3>'+name+'</h3><p>Full-page design preview · '+(kind==="cv"?"CV / Resume":kind==="letter"?"Application letter":"Tenancy agreement")+'</p><a href="/builder.html?template='+id+'">Choose this design →</a></article>'}).join("")}
document.querySelectorAll("[data-kind]").forEach(b=>b.addEventListener("click",()=>{kind=b.dataset.kind;document.querySelectorAll("[data-kind]").forEach(x=>x.classList.toggle("active",x===b));draw()}));draw();
</script></body></html>
