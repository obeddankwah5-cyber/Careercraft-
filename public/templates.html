<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>60 Full Template Previews | CareerCraft</title><link rel="stylesheet" href="/styles.css"><style>
.wrap{max-width:1250px;margin:auto;padding:55px 5%}.intro{text-align:center;margin-bottom:30px}.tabs{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:25px 0 35px}.tabs button{border:1px solid #e4ddec;background:#fff;padding:11px 17px;border-radius:9px;font-weight:700;color:#5d526f}.tabs button.active{background:#7544dc;color:white;border-color:#7544dc}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.card{padding:13px;border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}.preview{height:390px;background:#f7f5fa;padding:18px;display:flex;justify-content:center;overflow:hidden}.sheet{width:100%;max-width:255px;min-height:350px;background:white;box-shadow:0 5px 20px #25134418;padding:25px 20px;color:#24212a;border-top:7px solid var(--accent);position:relative;overflow:hidden}.sheet.layout-1:before{content:"";position:absolute;left:0;top:0;bottom:0;width:28%;background:var(--accent);opacity:.13}.sheet.layout-2{text-align:center;border-top-width:16px}.sheet.layout-2 h4{text-align:left}.sheet.layout-3{background:linear-gradient(180deg,#fff 0 20%,#faf8ff 20%)}.sheet.layout-4{outline:2px solid var(--accent);outline-offset:-9px}.sheet.side>*{position:relative}.sheet h3{font:800 13px Manrope;margin:5px 0;color:#202033}.sheet .contact{font-size:7px;color:#777;margin:7px 0 16px}.sheet h4{font:800 8px Manrope;letter-spacing:1px;color:var(--accent);margin:17px 0 7px}.line{height:4px;background:#e9e6ed;margin:6px 0;border-radius:4px}.line.short{width:65%}.line.mid{width:82%}.sheet .stamp{height:34px;width:34px;border-radius:50%;background:var(--accent);opacity:.15;float:right}.card h3{font:800 15px Manrope;margin:14px 3px 5px}.card p{font-size:11px;color:#766e84;margin:0 3px 12px}.card a{display:inline-block;margin:0 3px 5px;color:#7544dc;font-size:12px;font-weight:800}.number{font-size:9px;letter-spacing:1px;color:#8a8098;margin:0 3px}.empty{grid-column:1/-1;text-align:center;color:#766e84;padding:40px}

.real-sheet{display:flex;padding:0;max-width:270px;min-height:355px;border-top:0;overflow:hidden;text-align:left}.real-sheet .mini-side{width:34%;flex-shrink:0;background:var(--accent);color:#fff;padding:17px 10px;font-size:7px}.real-sheet .mini-side b{display:block;font:800 9px Manrope;line-height:1.2;overflow-wrap:anywhere}.real-sheet .mini-side small{display:block;font-size:6px;margin-top:4px;opacity:.85}.real-sheet .mini-side h4{color:#fff;font-size:7px;margin:17px 0 7px}.real-sheet .mini-side .line{background:#ffffff80;height:3px}.mini-avatar{width:39px;height:45px;border:2px solid #ffffffb0;border-radius:5px;margin-bottom:10px;background:linear-gradient(145deg,#ffffff88,#ffffff20)}.mini-main{flex:1;min-width:0;padding:17px 14px;background:#fff}.mini-main.has-side{padding:17px 12px}.mini-top{height:7px;background:var(--accent);margin:-17px -14px 15px}.real-sheet.layout-2 .mini-top{height:22px;margin-bottom:12px}.real-sheet.layout-3{outline:1px solid var(--accent);outline-offset:-7px}.real-sheet.layout-3 .mini-top{height:2px}.mini-main h3{font:800 12px Manrope;letter-spacing:.3px;margin:0;color:#202033}.mini-sub{font:700 6px Manrope;letter-spacing:1px;color:var(--accent);margin:4px 0 9px}.cv-contact{font-size:6px;line-height:1.6;color:#777;margin:5px 0 12px;border-bottom:1px solid #ddd;padding-bottom:8px}.mini-main h4{font:800 7px Manrope;letter-spacing:.6px;color:var(--accent);margin:12px 0 6px;border-bottom:1px solid color-mix(in srgb,var(--accent) 35%,white);padding-bottom:4px}.mini-main .line{height:3px;background:#e5e7eb;margin:5px 0;border-radius:2px}.mini-main .line.short{width:62%}.mini-main .line.mid{width:82%}.letter-date,.letter-address{font-size:6px;line-height:1.5;color:#555;margin:8px 0}.letter-greeting{font-size:6px;color:#555;margin:12px 0 4px}.real-sheet:not(:has(.mini-side)) .mini-main{width:100%}.real-sheet:not(:has(.mini-side)) .mini-top{height:12px}.real-sheet.layout-0 .mini-main h3,.real-sheet.layout-4 .mini-main h3{font-family:Georgia,serif}.real-sheet.layout-1 .mini-side{width:36%}.real-sheet.layout-4 .mini-side{width:30%}
.letter-sheet{width:100%;max-width:255px;min-height:355px;background:#fff;padding:22px 20px;color:#34343b;box-shadow:0 5px 20px #25134418;font:6.4px Arial,sans-serif;position:relative;overflow:hidden}.letter-kicker{font-size:6px;letter-spacing:.7px;font-weight:700;color:#52606a;display:flex;align-items:center;gap:5px;margin:-22px -20px 24px;padding:9px 20px;background:#f8faf8}.letter-kicker span{height:7px;width:42px;background:var(--accent);display:inline-block;margin-left:-20px}.letter-sender{text-align:right;line-height:1.9;margin:0 0 23px}.letter-recipient{line-height:1.9;margin:0 0 22px}.letter-salutation{margin:0 0 15px}.letter-subject{text-align:center;font-weight:800;text-decoration:underline;font-size:7px;line-height:1.5;margin:0 0 12px}.letter-copy p{font-size:6.3px;line-height:1.65;margin:0 0 9px;text-align:justify}.letter-closing{font-size:6.2px;line-height:1.8;margin-top:12px}.letter-layout-0,.letter-layout-4{font-family:Georgia,serif}.letter-layout-1 .letter-kicker,.letter-layout-3 .letter-kicker{background:#eef5eb}.letter-layout-2 .letter-sender{text-align:left;border-bottom:1px solid var(--accent);padding-bottom:10px}.letter-layout-2 .letter-subject{text-align:left;text-decoration:none;border-bottom:2px solid var(--accent);padding-bottom:7px}.letter-layout-3 .letter-sender{background:#f7f8fb;padding:9px}.letter-layout-4{border:2px solid var(--accent)!important;outline:1px solid var(--accent);outline-offset:-7px}.letter-plain{border:0!important;border-top:0!important;box-shadow:none!important;font-family:Arial,sans-serif;padding:22px 20px}.letter-plain .plain-sender{text-align:right;font-size:6.4px;line-height:1.8;margin:0 0 23px}.letter-plain .letter-recipient{margin-bottom:22px}.letter-plain .letter-subject{color:#222}.plain-sheet{width:100%;max-width:255px;min-height:355px;background:#fff;padding:25px 20px;color:#222;box-shadow:none;border:0!important;border-top:0!important;font-family:Arial,sans-serif}.plain-sheet h3{font:700 12px Arial;color:#222}.plain-sheet h4{font:700 7px Arial;color:#222!important;border-bottom:1px solid #ddd;padding-bottom:4px}.plain-sheet .line{background:#e5e5e5}.plain-small{font-size:6px;color:#555;margin:8px 0 15px}</style></head><body><header class="site-header"><a class="brand" href="/">CareerCraft</a><nav class="main-nav"><a href="/">Home</a><a href="/builder.html">Builder</a><a href="/pricing.html">Pricing</a></nav></header><main class="wrap"><div class="intro"><span class="eyebrow">60 FULL DESIGN PREVIEWS</span><h1 style="font:800 40px Manrope">Choose your <em style="color:#7544dc">template.</em></h1><p style="color:#766e84">Browse all 20 designs in each category. Previews are clear and visible before payment.</p></div><div class="tabs"><button class="active" data-kind="cv">CV / Resume · 20</button><button data-kind="letter">Application Letters · 20</button><button data-kind="tenancy">Tenancy Agreements · 20</button></div><div id="gallery" class="gallery"></div></main><footer class="site-footer">CareerCraft Ghana</footer><script>
const names={"cv":["Classic Professional","Modern Sidebar","Elegant Executive","Minimal Clean","Creative Profile","Academic Focus","Corporate Bold","Graduate Starter","Professional Compact","Contemporary","Technical Specialist","Healthcare Professional","Finance Executive","Marketing Creative","Two Column Modern","Clean Monochrome","Navy Executive","Warm Editorial","Plain Standard CV","Simple Text CV","Traditional No-Design CV"],"letter":["Traditional Formal","Modern Green Accent","Minimal Business Letter","Executive Correspondence","Classic Serif","Clean Contemporary","Bold Header","Elegant Editorial","Graduate Application","Creative Agency","Professional Navy","Warm Neutral","Academic Letter","Finance Formal","Healthcare Application","Compact Business","Modern Accent","Traditional Formal","Plain Standard Letter","Simple Text Letter","Traditional No-Design Letter"],"tenancy":["Classic Agreement","Modern Property","Formal Legal Layout","Clean Minimal","Executive Property","Residential Standard","Bold Sectioned","Elegant Contract","Compact Agreement","Contemporary Lease","Professional Rental","Neutral Property","Premium Tenancy","Simple Legal","Structured Lease","Modern Landlord","Tenant Friendly","Formal Serif","Plain Standard Agreement","Simple Text Agreement","Traditional No-Design Agreement"]};const colors=["#263b68","#315d72","#80604b","#41414b","#7544dc","#17675e","#252b38","#8a593c","#44516a","#365d86","#245b70","#6a4d7c","#3f5960","#9a563d","#4d547d","#353535","#183f68","#7b5a49","#285b50","#63438d"];let kind="cv";
function preview(n,i){const accent=colors[i],layout=i%5,cv=n==="cv",letter=n==="letter";if(i>=17){if(letter){return '<div class="preview"><div class="sheet letter-sheet letter-plain" style="--accent:#222"><div class="plain-sender">ALEX MORGAN<br>Accra, Ghana<br>+233 20 000 0000<br>alex@email.com</div><div class="plain-recipient">The Human Resource Manager<br>Company Name Limited<br>Accra, Ghana</div><div class="letter-salutation">Dear Sir/Madam,</div><div class="letter-subject">APPLICATION FOR EMPLOYMENT</div><div class="letter-copy"><p>I am writing to express my interest in the advertised position at your organisation. I believe my skills and experience would allow me to contribute positively to your team.</p><p>My education and practical experience have helped me develop strong communication, organisation and problem-solving skills. I am adaptable, motivated and able to work independently or as part of a team.</p><p>I would welcome the opportunity to discuss my application further. Thank you for your time and consideration.</p></div><div class="letter-closing">Yours faithfully,<br><b>ALEX MORGAN</b></div></div></div>'}const plainTitle=cv?"ALEX MORGAN":"TENANCY AGREEMENT";return '<div class="preview"><div class="sheet plain-sheet"><h3>'+plainTitle+'</h3><div class="plain-small">Accra, Ghana · Contact details</div>'+ (cv?'<h4>PROFILE</h4><div class="line"></div><div class="line"></div><h4>WORK EXPERIENCE</h4><div class="line"></div><div class="line"></div><h4>EDUCATION</h4><div class="line"></div><h4>SKILLS</h4><div class="line"></div>':'<h4>PARTIES</h4><div class="line"></div><h4>PROPERTY DETAILS</h4><div class="line"></div><h4>RENT & PERIOD</h4><div class="line"></div><h4>TERMS</h4><div class="line"></div>')+'</div></div>'}if(letter){return '<div class="preview"><div class="sheet letter-sheet letter-layout-'+layout+'" style="--accent:'+accent+'"><div class="letter-kicker"><span></span> APPLICATION LETTER</div><div class="letter-sender">ALEX MORGAN<br>Accra, Ghana<br>+233 20 000 0000<br>alex@email.com</div><div class="letter-recipient">The Human Resource Manager<br>Company Name Limited<br>Accra, Ghana</div><div class="letter-salutation">Dear Sir/Madam,</div><div class="letter-subject">APPLICATION FOR EMPLOYMENT</div><div class="letter-copy"><p>I am writing to express my interest in the advertised position at your organisation. I believe my skills and experience would allow me to contribute positively to your team.</p><p>My education and practical experience have helped me develop strong communication, organisation and problem-solving skills. I am adaptable, motivated and able to work independently or as part of a team.</p><p>I would welcome the opportunity to discuss my application further. Thank you for your time and consideration.</p></div><div class="letter-closing">Yours faithfully,<br><b>ALEX MORGAN</b></div></div></div>'}const title=cv?"ALEX MORGAN":"TENANCY AGREEMENT",side=layout===1||layout===4,sections=cv?[["PROFILE",3],["WORK EXPERIENCE",4],["EDUCATION",2],["SKILLS",3]]:[["PARTIES",2],["PROPERTY DETAILS",2],["RENT & PERIOD",2],["TERMS & CONDITIONS",4],["SIGNATURES",2]];const blocks=sections.map(([h,c])=>'<h4>'+h+'</h4>'+Array.from({length:c},(_,j)=>'<div class="line '+(j%3===1?'mid':j%3===2?'short':'')+'"></div>').join('')).join('');return '<div class="preview"><div class="sheet real-sheet layout-'+layout+'" style="--accent:'+accent+'">'+(side?'<aside class="mini-side"><div class="mini-avatar"></div><b>'+title+'</b><small>DOCUMENT</small></aside>':'')+'<div class="mini-main"><div class="mini-top"></div><h3>'+title+'</h3>'+blocks+'</div></div></div>'}
function draw(){const g=document.getElementById("gallery");g.innerHTML=names[kind].map((name,i)=>{let id=kind+"-"+String(i+1).padStart(2,"0");return '<article class="card">'+preview(kind,i)+'<div class="number">DESIGN '+String(i+1).padStart(2,"0")+' OF 20</div><h3>'+name+'</h3><p>Full-page design preview · '+(kind==="cv"?"CV / Resume":kind==="letter"?"Application letter":"Tenancy agreement")+'</p><a href="/builder.html?template='+id+'">Choose this design →</a></article>'}).join("")}
document.querySelectorAll("[data-kind]").forEach(b=>b.addEventListener("click",()=>{kind=b.dataset.kind;document.querySelectorAll("[data-kind]").forEach(x=>x.classList.toggle("active",x===b));draw()}));draw();
</script></body></html>
