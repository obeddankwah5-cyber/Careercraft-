<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10233f">
<title>Your document is ready — CareerCraft</title>
<link rel="stylesheet" href="/styles.css">
<style>
*{box-sizing:border-box}
body{background:#f5f6f8;min-height:100vh;margin:0;padding:24px 14px;color:#21143d}
.success-wrap{max-width:900px;margin:0 auto}
.success-card{background:#fff;border:1px solid #e6e8ec;border-radius:16px;padding:30px;text-align:center;box-shadow:0 20px 60px #10233f12}
.success-icon{width:58px;height:58px;border-radius:50%;background:#e6f5ee;color:#16845c;display:grid;place-items:center;font-size:28px;margin:0 auto 16px}
.success-card h1{font:800 27px Manrope;color:#10233f;margin:10px 0}
.success-card p{font-size:13px;line-height:1.7;color:#68758a}
.status{font-size:11px;color:#16845c}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:20px 0}
.action{display:inline-flex;align-items:center;justify-content:center;padding:13px 20px;border-radius:9px;background:#7444e5;color:#fff;font-size:13px;font-weight:700;text-decoration:none}
.action.secondary{background:#fff;color:#4b287e;border:1px solid #ded4ee}
.preview-card{margin-top:18px;background:#fff;border:1px solid #e6e8ec;border-radius:14px;padding:16px;box-shadow:0 12px 35px #10233f0c}
.preview-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px}
.preview-heading h2{font:800 16px Manrope;margin:0;color:#21143d}
.pdf-frame{display:block;width:100%;height:min(78vh,900px);min-height:520px;border:1px solid #e6e8ec;border-radius:8px;background:#eef0f4}
.back-link{display:inline-block;margin-top:18px;font-size:12px;color:#7444e5}
@media(max-width:600px){.success-card{padding:25px 18px}.pdf-frame{height:68vh;min-height:430px}.preview-card{padding:10px}}
</style>
</head>
<body>
<main class="success-wrap">
<section class="success-card">
<div class="success-icon" id="icon">✓</div>
<div class="eyebrow">CAREERCRAFT CHECKOUT</div>
<h1 id="heading">Checking your payment…</h1>
<p id="message">Please keep this page open while we confirm your payment and prepare your PDF.</p>
<div id="downloadArea"></div>
<a class="back-link" href="/">Return to CareerCraft</a>
</section>
<section class="preview-card" id="previewCard" hidden>
<div class="preview-heading"><h2>Your PDF preview</h2><span class="status">Payment confirmed</span></div>
<iframe id="pdfFrame" class="pdf-frame" title="Your generated PDF preview"></iframe>
</section>
</main>
<script>
const token=new URLSearchParams(location.search).get("access");
const heading=document.getElementById("heading"),message=document.getElementById("message"),area=document.getElementById("downloadArea");
const previewCard=document.getElementById("previewCard"),pdfFrame=document.getElementById("pdfFrame");
let attempts=0,readyShown=false;
async function check(){
 if(!token){heading.textContent="No order found";message.textContent="Open the payment link again or contact support.";return}
 try{
  const r=await fetch("/api/orders/"+encodeURIComponent(token),{cache:"no-store"});
  const data=await r.json();
  if(!r.ok)throw new Error(data.error||"Order lookup failed.");
  if(data.status==="paid"){
   heading.textContent="Your document is ready.";
   message.textContent="Payment confirmed. Preview your PDF below, then save or print it.";
   if(!readyShown){
    readyShown=true;
    area.innerHTML='<div class="actions"><a class="action" href="/download/'+encodeURIComponent(token)+'">Save PDF ↓</a><a class="action secondary" href="/print/'+encodeURIComponent(token)+'" target="_blank" rel="noopener">Open to print ↗</a></div><p class="status">✓ Payment verified · '+(data.documentType||"Document")+'</p>';
    pdfFrame.src="/print/"+encodeURIComponent(token);
    previewCard.hidden=false;
   }
  }else{
   heading.textContent="Payment is being confirmed";
   message.textContent="Your PDF will become available here once Paystack confirms payment. Please wait; do not pay again while this check is running.";
   if(attempts++<90)setTimeout(check,4000);
  }
 }catch(e){
  heading.textContent="We could not load this order";
  message.textContent=(e.message||"Please refresh the page.")+" If you have been charged, contact support before trying another payment.";
  if(attempts++<15)setTimeout(check,5000);
 }
}
check();
</script>
</body>
</html>
