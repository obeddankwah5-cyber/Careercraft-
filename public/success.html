<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10233f"><title>Your document is ready — CareerCraft</title><link rel="stylesheet" href="/styles.css"><style>body{background:#f5f6f8;min-height:100vh;display:grid;place-items:center;padding:20px}.success-card{max-width:520px;width:100%;background:#fff;border:1px solid #e6e8ec;border-radius:14px;padding:42px;text-align:center;box-shadow:0 20px 60px #10233f12}.success-icon{width:62px;height:62px;border-radius:50%;background:#e6f5ee;color:#16845c;display:grid;place-items:center;font-size:30px;margin:0 auto 20px}.success-card h1{font:800 28px Manrope;color:#10233f}.success-card p{font-size:13px;line-height:1.7;color:#68758a}.success-card .primary-btn{margin:20px 0 8px;width:100%}.status{font-size:11px;color:#16845c}</style></head><body><main class="success-card"><div class="success-icon" id="icon">✓</div><div class="eyebrow">CAREERCRAFT CHECKOUT</div><h1 id="heading">Checking your payment…</h1><p id="message">Please keep this page open while we confirm your payment and prepare your PDF.</p><div id="downloadArea"></div><p><a href="/" class="text-link">Return to CareerCraft</a></p></main><script>
const token = new URLSearchParams(location.search).get("access");
const heading=document.getElementById("heading"), message=document.getElementById("message"), area=document.getElementById("downloadArea");
async function check(){if(!token){heading.textContent="No order found";message.textContent="Open the payment link again or contact support.";return}
try{const r=await fetch("/api/orders/"+encodeURIComponent(token));const data=await r.json();if(!r.ok)throw new Error(data.error);
if(data.status==="paid"){heading.textContent="Your document is ready.";message.textContent="Payment confirmed. Your "+(data.documentType||"document")+" is ready to download, print or share.";area.innerHTML='<a class="primary-btn" href="/download/'+encodeURIComponent(token)+'">Download your PDF ↓</a><p class="status">✓ Payment confirmed</p>';}
else{heading.textContent="Payment is being confirmed";message.textContent="Please refresh this page in a moment. If you were charged and the document does not appear, contact support.";setTimeout(check,4000);}
}catch(e){heading.textContent="We could not load this order";message.textContent=e.message||"Please refresh or contact support.";}}
check();
</script></body></html>
